services:
  api:
    build: .
    environment:
      PORT: 3000
      BIND_HOST: 0.0.0.0
      DATABASE_URL: "postgres://eventbridge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}@db:5432/eventbridge"
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      SNAPSHOT_READ_SECRET: ${SNAPSHOT_READ_SECRET:-}
      DASHBOARD_ACCESS_TOKEN: ${DASHBOARD_ACCESS_TOKEN:-}
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
      POSTGRES_DB: eventbridge
    volumes:
      - eventbridge-postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventbridge -d eventbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  eventbridge-postgres-data:
